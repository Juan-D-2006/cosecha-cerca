# Permite actualizar el repo subiendo un único source.tar.gz desde la web de GitHub
name: Unpack source upload
on:
  push:
    paths: ["source.tar.gz"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          tar -xzf source.tar.gz
          git rm -q --cached source.tar.gz
          rm -f source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source.tar.gz" || echo "Nothing to commit"
          git push
